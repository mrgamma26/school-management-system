        text: "Test123!"
      - action: "click"
        selector: "button[type='submit']"
      - action: "wait_for_element"
        selector: "[data-testid='logout-button'], .logout-btn"
        timeout: 10000
      - action: "click"
        selector: "[data-testid='logout-button'], .logout-btn"
      - action: "wait_for_element"
        selector: "input[type='email']"
        timeout: 5000
    expected: "Should return to login page"
