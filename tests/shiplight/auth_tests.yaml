# Authentication Tests - School Management System
# Test ID Range: AUTH-001 to AUTH-009

tests:
  - id: AUTH-001
    name: "Super User Login Validation"
    description: "Verify super user can log in with correct credentials"
    steps:
      - action: "navigate"
        url: "{{APP_URL}}"
      - action: "wait_for_element"
        selector: "input[type='email']"
      - action: "type"
        selector: "input[type='email']"
        text: "super@schoolsystem.test"
      - action: "type"
        selector: "input[type='password']"
        text: "Test123!"
      - action: "click"
        selector: "button[type='submit']"
      - action: "wait_for_element"
        selector: "[data-testid='dashboard'] h1"
        timeout: 10000
    expected: "Super User Dashboard should load"
    status: "PENDING"

