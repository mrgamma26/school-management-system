# Super User Tests - School Management System  
# Test ID Range: SU-001 to SU-020

tests:
  - id: SU-001
    name: "Super User Dashboard Access"
    description: "Verify super user can access all dashboard sections"
    prerequisite: "LOGIN as super@schoolsystem.test"
    steps:
      - action: "wait_for_element"
        selector: "[data-testid='dashboard']"
      - action: "verify_element_exists"
        selector: "[data-testid='user-management-card']"
      - action: "verify_element_exists"
        selector: "[data-testid='admin-tools-card']"
      - action: "verify_element_exists"
        selector: "[data-testid='system-settings-card']"
      - action: "screenshot"
        name: "super_user_dashboard"
    expected: "All administrative sections should be visible"
    status: "PENDING"

  - id: SU-002
    name: "Create New Administrator"
    description: "Verify super user can create new administrator accounts"
    prerequisite: "LOGIN as super@schoolsystem.test"
    steps:
      - action: "click"
        selector: "[data-testid='user-management-link']"
      - action: "wait_for_element"
        selector: "[data-testid='create-user-btn']"
      - action: "click"
        selector: "[data-testid='create-user-btn']"
      - action: "select_option"
        selector: "select[name='role']"
        value: "administrator"
      - action: "type"
        selector: "input[name='email']"
        text: "newadmin@test.com"
      - action: "type"
        selector: "input[name='firstName']"
        text: "Test"
      - action: "type"
        selector: "input[name='lastName']"
        text: "Admin"
      - action: "click"
        selector: "button[type='submit']"
      - action: "wait_for_element"
        selector: ".success-message"
    expected: "New administrator should be created successfully"
    status: "PENDING"

  - id: SU-003
    name: "System Configuration Access"
    description: "Verify super user can access system configuration"
    prerequisite: "LOGIN as super@schoolsystem.test"
    steps:
      - action: "click"
        selector: "[data-testid='system-settings-link']"
      - action: "wait_for_element"
        selector: "[data-testid='system-config']"
      - action: "verify_element_exists"
        selector: "[data-testid='school-settings']"
      - action: "verify_element_exists"
        selector: "[data-testid='academic-settings']"
    expected: "System configuration should be accessible"
    status: "PENDING"